# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "bbded2a5a5891b5a874d58aff9899bc4"
name = "BYNDCART"
application_url = "https://byndcart-production-23f7.up.railway.app/"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  topics = [
  "orders/create",
  "orders/updated",
  "products/create",
  "products/update"
]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_customers,write_draft_orders,write_inventory,read_inventory,read_orders,write_orders,write_fulfillments,read_products,write_products,read_returns,write_returns,write_store_credit_account_transactions,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://byndcart-production-23f7.up.railway.app/auth/callback",
  "https://byndcart-production-23f7.up.railway.app/auth/shopify/callback",
  "https://byndcart-production-23f7.up.railway.app/api/auth/callback"
]

[app_proxy]
url = "/apps/returns"
subpath = "returns"
prefix = "apps"
